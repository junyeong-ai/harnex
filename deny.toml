# Supply chain security — cargo-deny v0.19+ config.
# CI: EmbarkStudios/cargo-deny-action@v2.

[advisories]
ignore = []

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"

# The constitution picks `jiff` and `std::sync::LazyLock` as the time and lazy
# primitives. Naming the alternatives here is what makes that a decision to
# argue for rather than a dependency to inherit unnoticed. `once_cell` reaches
# the tree through a dev dependency, which is not this workspace reading it.
deny = [
  { name = "chrono" },
  { name = "time" },
  { name = "once_cell", wrappers = ["tempfile"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
