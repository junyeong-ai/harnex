name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked

  test:
    # The release publishes a macOS binary, so the tests run where it runs.
    # path_guard's rename and symlink handling and the session module's
    # transcript discovery both sit on filesystem behaviour that differs there.
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: cargo nextest run --workspace --all-targets --locked --no-fail-fast
      # nextest does not run doctests.
      - run: cargo test --workspace --doc --locked

  page-script:
    # The script `ask serve` sets into a page runs in whichever browser the
    # platform opens, so it is driven through all three engines against the
    # binary this commit builds.
    name: ask page script
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: crates/harness-cli/tests/ask-page
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p harness-cli --locked
        working-directory: .
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: crates/harness-cli/tests/ask-page/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # MSRV asks whether the floor compiles, not whether it lints identically
      # to the pinned toolchain, so the workspace's deny-warnings flag is off
      # here — a lint added between the floor and the pin is not a floor break.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: compile against the declared rust-version floor
        run: |
          floor=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          [ -n "$floor" ] || { echo "Cargo.toml declares no rust-version"; exit 1; }
          echo "declared floor: $floor"
          rustup toolchain install "$floor" --profile minimal
          RUSTUP_TOOLCHAIN="$floor" cargo check --workspace --all-targets --locked

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  schema-drift:
    name: schema drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: verify schemas match generated
        run: |
          cargo run -p harness-cli --quiet --locked -- \
            export schema config --raw > /tmp/generated.schema.json
          diff -u schemas/harness.schema.json /tmp/generated.schema.json

  audit:
    name: harnex audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test]
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: run harnex audit
        run: |
          cargo run -p harness-cli --quiet --locked -- \
            audit --plugin-root plugins/harnex

      # The oracle over its own surfaces. Without this the repo declares
      # rules and settings that its own validators have never read, and a
      # rule shipped without `paths:` costs every session its whole body
      # with nothing to say so.
      - name: run harnex check
        run: cargo run -p harness-cli --quiet --locked -- check
