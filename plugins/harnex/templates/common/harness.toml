# harness oracle configuration.
#
# Without this file the oracle answers CONFIG_NOT_FOUND, and `harnex check`,
# `harnex validate`, `harnex lifecycle` and `harnex telemetry` are all
# unreachable — including the retirement sweep `governance.md` sends you to.
# The scaffold ships it so the loop those rules describe is runnable from the
# first commit rather than after someone notices.
#
# Every validator with a subject here is on. The surfaces a fresh scaffold has
# none of yet stay declared anyway, so the first skill or sub-agent added is
# checked from its first commit instead of whenever someone remembers to widen
# this file.

[meta]
harnex_version = ">=0.3, <0.4"

[validate.rules]
# The Claude Code memory budget applies to what loads every turn — a rule
# carrying no `paths:`. Path-scoped rules cost context only on the files they
# govern, so `max_scoped_lines` stays unset: a cohesive long rule is not a
# defect. `constitution.md` is the one artifact the scaffold emits that is
# meant to load unconditionally.
max_lines = 200
always_loaded_slugs = ["constitution", "agent-conduct"]
# Every path-scoped rule declares what it is truth ABOUT (`governs:` —
# concept + live_truth), which is a different question from when it loads
# (`paths:`). `harnex governs resolve` inverts the declarations into review
# scope, and `harnex check` flags a declared truth that no longer exists —
# the drift that makes a rule actively misleading. Always-loaded rules are
# exempt: they are in every context already, and some have no truth in the
# tree to declare.
require_governs = true

# `reject_unknown_keys` is opt-in in the oracle because a hardcoded key list
# lags the upstream spec, and a stale list turns valid frontmatter into a
# finding. A harnex harness opts in anyway: Claude Code silently ignores an
# unknown key, so a typo costs the field it was meant to set with no signal at
# all, and every command's envelope carries a warning when a surface's
# measurement is old enough to distrust. Turn one off if a spec addition outpaces a regenerate.
[validate.skills]
reject_unknown_keys = true
# Advisory (Minor, never gating): a description carrying `commit`, `deploy`,
# `delete`, `send`, `publish` or `release` without `disable-model-invocation`
# is worth a second look, and the check matches prose rather than intent, so a
# read-only skill that reviews commits trips it. That is why it reports and
# does not block.
flag_side_effect_verbs = true

[validate.agents]
reject_unknown_keys = true

# Shape gate for .claude/routines/*.md (the routines pattern installs the
# first ones). Schedule state is `harnex lifecycle routines`' answer, never
# a check finding.
[validate.routines]

[validate.output_styles]
reject_unknown_keys = true

# A rule is worth its context only while what it describes is still there, and
# the drift that makes one actively misleading is the artifact it cites moving
# or disappearing. `harnex check` reads every `CLAUDE.md` the project owns and
# every surface it validates for shape — rules, skills, agents, output styles,
# routines — and resolves every marked claim against the tree:
#
#   [file: pyproject.toml]              the file exists
#   [file: path/to/thing.py:42]         and is at least that long
#   [file: docs/design.md § Storage]    and spells that heading, exactly once
#
# Pick the anchor for what it proves. A line survives the edit that moves its
# subject — the check only ever asked how long the file is — so a heading is
# the stronger anchor wherever the target has one: it fails on the rename that
# invalidated the claim, and a heading two sections answer to fails as well,
# because a pointer resolving to both names neither.
#
# Marked rather than inferred, which is what keeps the check out of prose. A
# bare backtick path is documentation and stays documentation; `api/gateway.io:8443`
# is a host and a port, and nothing distinguishes that shape from a file and a
# line. Write the marker whenever a rule states something the code is the truth
# for — the two harnesses this scaffold is modelled on name an owner in every
# single rule they carry.
[evidence]
default_provenance = "internal"

[[evidence.verifiers]]
provenance = "internal"
strategy = "file-path-line"

# An expensive or stochastic measurement (a contrast audit, a behaviour
# eval) never gates on its findings — the freshness of its basis does.
# Declare one, record it with `harnex evidence record --id <id>`, and
# `harnex check` flags evidence whose declared inputs or instrument moved.
# `unattended_remeasure = true` only where the person a push gate blocks
# can re-measure in the same sitting.
#
# [[evidence.advisories]]
# id = "content-contrast"
# inputs = ["src/styles"]
# # In-tree content is the instrument's identity; a wrapper that shells out
# # re-points with no tree diff, so its lockfile stands beside it.
# engine = ["tools/contrast-audit", "package-lock.json"]
# unattended_remeasure = false

# The enforcement floor: `harnex guard floor` (PreToolUse, wired by the
# enforcement-floor pattern) blocks a git command that would skip the hook
# stack and an agent write to a file the gates are defined by. harness.toml,
# .claude/settings.json and .claude/settings.local.json are built into the
# floor; list the project's own gate-defining files here (a trailing /
# freezes a directory). The operator's break-glass is
# HARNEX_ALLOW_FLOOR_EDIT: "1" in the settings.local.json env block.
[guard.floor]
protected_paths = ["hooks/", ".gitleaks.toml"]

# The promotion-and-retirement loop `governance.md` and `artifact-lifecycle.md`
# describe. Every threshold has a default, so the section is declared empty on
# purpose: the loop is runnable from the first commit, and the numbers are
# tuned once the corpus is large enough to have an opinion. Without the
# section, `harnex lifecycle observe|candidates|retire` — the commands those
# rules send you to — answer CONFIG_INVALID.
#
# The sweep's subjects are `[[kinds]]`, which this scaffold declares none of:
# what a project retires is its own vocabulary. Give a kind
# `invocation_kind = "<a telemetry Kind>"` only where that Kind's events can
# name the kind's slugs — the Silent signal then means something for it, and
# every other kind stays honestly `unmeasured` rather than convicted by a
# record that could never have named it.
[lifecycle]

# Where Claude Code writes the transcripts `/harnex:measure` reads. The oracle
# ships no default for this — a machine-global path compiled into a binary is
# the author's layout running on someone else's machine — but a harness written
# by a Claude Code plugin knows the layout, and without the section `measure`
# and the retirement sweep both answer that `[session]` is not configured.
# Set it to `$CLAUDE_CONFIG_DIR/projects` instead if that variable relocates
# `~/.claude` here; `~` is the only expansion this field performs.
[session]
roots = ["~/.claude/projects"]

# `lifecycle retire` derives its Silent verdict from this ledger, so the sweep
# needs the section even before the project records anything. A project's own
# event schema is its own vocabulary — declare a `[[telemetry.kinds]]` when
# there is something domain-specific to count; inventing one here would be the
# guessing harnex refuses.
[telemetry]
storage_dir = ".harness/telemetry"

# The auto-emit Kind the telemetry-kinds pattern feeds: one row per harness
# element (Skill / Task / Agent) invocation, carrying the element's slug and
# whether the call succeeded. The closed schema bounds the SHAPE — an
# undeclared field is rejected at append; `harnex guard telemetry-emit` bounds
# the VALUE, emitting only the element's own slug (its name, not operator
# content) resolved through the one tool→element authority. `outcome` comes
# from which hook event fired, so a failure cannot be recorded as a success.
# A skill or sub-agent kind sets `invocation_kind = "harness_invocation"` to
# read its silence from here: within a window this Kind recorded, a slug it
# never names is a Silent candidate. Only those kinds — `surface` is an
# element's name, so this record can never name a rule.
[[telemetry.kinds]]
name = "harness_invocation"
payload_schema = { type = "object", required = ["surface", "outcome"], properties = { surface = { type = "string" }, outcome = { type = "string", enum = ["ok", "failed"] } } }
