# Pattern library manifest — single source of truth for `extend pattern`.
#
# Each [[pattern]] declares a slug, the files it installs (each with the
# template source under `templates/patterns/<slug>/` and the project-relative
# destination it lands at), and the concern areas the skill analyzes before
# customizing. The `pattern_manifest_sync` integration test verifies this
# manifest agrees with the `templates/patterns/<slug>/` directories on disk and
# that every destination is project-relative — adding a pattern directory
# without a manifest entry (or vice versa) fails the build.
# (Constitution IX: no hand-maintained fact in two places without a guard.)

[[pattern]]
slug = "review-lenses"
analyze = ["existing .claude/rules/ for anchors", "file types present for applies_to", "authorities a finding may cite — lint codes, named CI gates, schema checks", "blast-radius signals for the bookend trigger", "the fast gate command the loop's verify step runs"]
files = [
  { template = "review-lenses.md", destination = ".claude/rules/review-lenses.md" },
  { template = "skill/SKILL.md", destination = ".claude/skills/review/SKILL.md" },
  { template = "skill/convergence.md", destination = ".claude/skills/review/convergence.md" },
  { template = "critique/SKILL.md", destination = ".claude/skills/critique/SKILL.md" },
  { template = "design-review/SKILL.md", destination = ".claude/skills/design-review/SKILL.md" },
  { template = "agent/reviewer.md", destination = ".claude/agents/reviewer.md" },
  { template = "lenses/completeness.md", destination = ".claude/lenses/completeness.md" },
  { template = "lenses/best-practice.md", destination = ".claude/lenses/best-practice.md" },
  { template = "lenses/extensibility.md", destination = ".claude/lenses/extensibility.md" },
  { template = "lenses/logic.md", destination = ".claude/lenses/logic.md" },
  { template = "lenses/naming.md", destination = ".claude/lenses/naming.md" },
  { template = "lenses/root-cause.md", destination = ".claude/lenses/root-cause.md" },
]

[[pattern]]
slug = "spec-workflow"
analyze = ["existing specs/ or docs/adr/ layout — check-plan.sh's PLAN_GLOB follows it", "blast-radius signals that should fire design_review", "where the project keeps learnings a retired spec retargets onto"]
files = [
  { template = "spec-workflow.md", destination = ".claude/rules/spec-workflow.md" },
  { template = "skill/SKILL.md", destination = ".claude/skills/spec/SKILL.md" },
  { template = "skill/gates.md", destination = ".claude/skills/spec/gates.md" },
  { template = "skill/resume.md", destination = ".claude/skills/spec/resume.md" },
  { template = "specs/spec.md", destination = "specs/_template/spec.md" },
  { template = "specs/plan.md", destination = "specs/_template/plan.md" },
  { template = "specs/wrapup.md", destination = "specs/_template/wrapup.md" },
  { template = "check-plan.sh", destination = "hooks/pre-commit.d/check-plan.sh" },
]

[[pattern]]
slug = "telemetry-kinds"
analyze = ["the [telemetry] storage_dir and any domain [[telemetry.kinds]] already declared", "PostToolUse + PostToolUseFailure hook entries dispatching telemetry-emit.sh through _runner.sh with matcher `Skill|Task|Agent`", "whether the retirement sweep should read the harness_invocation ledger"]
files = [
  { template = "telemetry-kinds.md", destination = ".claude/rules/telemetry-kinds.md" },
  { template = "telemetry-emit.sh", destination = "hooks/telemetry-emit.sh" },
]

[[pattern]]
slug = "deprecation"
analyze = ["native deprecation markers in the language", "source roots for governs.live_truth"]
files = [
  { template = "deprecation.md", destination = ".claude/rules/deprecation.md" },
]

