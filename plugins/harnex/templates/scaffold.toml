# Scaffold composition manifest — the single source of truth for what a
# generated harness contains.
#
# Three consumers read this file and no other statement of the composition
# exists: the skill emits these artifacts, the `plugin_scaffold_validates`
# test builds its fixture from them, and `harness audit` reports which
# destinations a project already holds. A file list written a second time in
# prose is what let a scaffold fixture drift into omitting every hook while
# still reporting green (Constitution IX).
#
# Fields:
#   tier         "foundation" (language-agnostic) | "language" (needs a profile)
#   content      how the project's copy relates to this template — see below
#   template     path under `templates/`; `{lang}` resolves to the detected language
#   destination  project-relative path; `{lang}` resolves the same way
#   executable   the artifact is a script and is written 0o755
#
# `content.kind` is the discriminator every consumer switches on, because how
# an artifact is emitted, how its presence is tested, and what counts as drift
# are one decision rather than three:
#
#   copy     machinery — the project's copy must stay byte-identical, because
#            this template is the only statement of what it does.
#   seed     a starting point the project takes ownership of. Written once,
#            never held to the template afterwards: a project's governance is
#            its own, and tailoring it is the intended use, not drift.
#   managed  partitioned by `<!-- harnex-managed -->` sentinels — harnex owns
#            what they bound, the project owns everything outside them.
#
# The kind also decides what happens when the DESTINATION ALREADY EXISTS, which
# is the common case rather than the exceptional one: a repo with no `.claude/`
# usually still has a `CLAUDE.md`, because Claude Code reads one without any
# `.claude/` directory at all, and a repo with git hooks already has `hooks/`.
# The answer is the kind's own meaning, not a new field:
#
#   copy     an incumbent at that path is a different thing wearing the same
#            name. Keep it, emit nothing, and report the collision — silently
#            replacing a project's `hooks/pre-commit` is the worst outcome
#            available.
#   seed     the project already owns one. Keep it, emit nothing, report.
#   managed  harnex owns only what its sentinels bound, so contribute those
#            blocks and leave every other byte of the incumbent alone. On a
#            file that does not exist yet, "everything else" is empty and this
#            is a plain write. Same rule as `regenerate`, which is the point:
#            one contract, not one per mode.
#   merge    already collision-aware — the union at `key` is defined against
#            whatever is there, including entries the project wrote itself.
#
# Emission is therefore idempotent: running a scaffold twice changes nothing
# the second time.
#   merge    a JSON fragment contributed at `key`. Several artifacts may name
#            the same key — `hooks` and `permissions.allow` are each claimed by
#            both tiers — and the contribution is a UNION, never a replacement:
#            the language tier adds its PostToolUse entry beside the
#            foundation's SessionStart and Stop rather than erasing them.
#            An object fragment contributes its keys; an array fragment its
#            elements, unioned as a sorted set. No contribution may be claimed
#            twice, so the union is order-independent and idempotent. Presence
#            is the fragment landing at its key, not the shared destination
#            existing.
#
# Adding a language means adding its `<lang>-dev` profile plus the three
# `{lang}` template files — never an edit here. The language set derives from
# `PermissionProfile::ALL`, which is what the drift test resolves `{lang}`
# against in both directions.

# ---------- foundation: emitted for every project ----------

[[artifact]]
tier = "foundation"
content = { kind = "merge", key = "permissions.deny" }
template = "common/permissions.deny.json"
destination = ".claude/settings.json"

[[artifact]]
tier = "foundation"
content = { kind = "merge", key = "permissions.allow" }
template = "common/permissions.allow.json"
destination = ".claude/settings.json"

[[artifact]]
tier = "foundation"
content = { kind = "merge", key = "hooks" }
template = "common/hooks.json"
destination = ".claude/settings.json"

[[artifact]]
tier = "foundation"
content = { kind = "managed" }
template = "common/CLAUDE.md"
destination = "CLAUDE.md"

[[artifact]]
tier = "foundation"
content = { kind = "managed" }
template = "common/rules/constitution.md"
destination = ".claude/rules/constitution.md"

[[artifact]]
tier = "foundation"
content = { kind = "seed" }
template = "common/rules/agent-conduct.md"
destination = ".claude/rules/agent-conduct.md"

[[artifact]]
tier = "foundation"
content = { kind = "seed" }
template = "common/rules/governance.md"
destination = ".claude/rules/governance.md"

[[artifact]]
tier = "foundation"
content = { kind = "seed" }
template = "common/rules/artifact-lifecycle.md"
destination = ".claude/rules/artifact-lifecycle.md"

[[artifact]]
tier = "foundation"
content = { kind = "seed" }
template = "common/harness.toml"
destination = "harness.toml"

[[artifact]]
tier = "foundation"
content = { kind = "seed" }
template = "common/skills/harness-curate/SKILL.md"
destination = ".claude/skills/harness-curate/SKILL.md"

[[artifact]]
tier = "foundation"
content = { kind = "copy" }
template = "common/_runner.sh"
destination = "hooks/_runner.sh"
executable = true

[[artifact]]
tier = "foundation"
content = { kind = "copy" }
template = "common/_stop_runner.sh"
destination = "hooks/_stop_runner.sh"
executable = true

[[artifact]]
tier = "foundation"
content = { kind = "copy" }
template = "common/session-start.sh"
destination = "hooks/session-start.sh"
executable = true

[[artifact]]
tier = "foundation"
content = { kind = "copy" }
template = "common/check-on-stop.sh"
destination = "hooks/check-on-stop.sh"
executable = true

[[artifact]]
tier = "foundation"
content = { kind = "copy" }
template = "common/git-hooks/pre-commit"
destination = "hooks/pre-commit"
executable = true

# ---------- language: emitted once per detected stack ----------
#
# Detection answers with a SET, not a winner. A lockfile is evidence that a
# stack is present, never evidence that it is the only one, and a repository
# with two of them has two — one measured here holds 17,085 `.py` files beside
# 3,433 `.ts`, and picking by row order would have handed it a formatter that
# silently skips 83% of its source. Every artifact below therefore resolves
# per language: `permissions.allow` and `hooks.PostToolUse` union across the
# matched set, and the conventions rule and formatter carry `{lang}` in their
# destination so two stacks never collide.
#
# Each `post-format-{lang}.sh` dispatches on the file extension and exits 0 on
# anything it does not own, so several of them coexist as separate PostToolUse
# entries with no arbitration between them.

[[artifact]]
tier = "language"
content = { kind = "merge", key = "permissions.allow" }
template = "{lang}/permissions.allow.json"
destination = ".claude/settings.json"

[[artifact]]
tier = "language"
content = { kind = "merge", key = "hooks.PostToolUse" }
template = "{lang}/hooks.format.json"
destination = ".claude/settings.json"

[[artifact]]
tier = "language"
content = { kind = "copy" }
template = "{lang}/post-format.sh"
destination = "hooks/post-format-{lang}.sh"
executable = true

[[artifact]]
tier = "language"
content = { kind = "seed" }
template = "{lang}/rules/{lang}-conventions.md"
destination = ".claude/rules/{lang}-conventions.md"
