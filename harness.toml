# harnex, checked by the oracle harnex ships.
#
# Only the validators that have a subject here are enabled: this repo declares
# rules and settings, and carries no skills, sub-agents, or output styles yet —
# their sections stay on so the first one added is checked from its first
# commit rather than whenever someone remembers to widen this file.
#
# policy and codegen stay absent: this repo runs neither loop on itself, and
# `harness check` reporting them skipped with a reason is the honest answer.
# lifecycle and telemetry are ON (below): the promotion/retirement loop this
# repo ships was field-tested only by its consumers until 2026-08 — the loop's
# own friction has to be findable here, on the corpus that builds it.

[meta]
harnex_version = ">=0.1, <0.2"

# The rules here name the module that owns each fact, which is the whole of
# Article IX, and a name is only worth more than prose while it still resolves.
# `harness check` reads `CLAUDE.md` and `.claude/rules/**/*.md` and holds every
# marked claim — `[file: path/to/thing.rs:42]`, the line optional — to the tree.
#
# The subject is real: this is the check a generated harness now ships, and a
# rule pointing at a module that was renamed is exactly the drift the retirement
# sweep looks for by hand. The marker is what keeps it out of prose — a bare
# backtick path is documentation, and a host and port share the shape of a file
# and a line.
[evidence]
default_provenance = "internal"

[[evidence.verifiers]]
provenance = "internal"
strategy = "file-path-line"

[validate.rules]
# The Claude Code memory budget applies to what loads every turn. Every other
# rule here is path-scoped and costs context only on the files it governs, so
# `max_scoped_lines` stays unset — a cohesive long rule is not a defect.
max_lines = 200
always_loaded_slugs = ["constitution", "making-changes"]

[validate.skills]

[validate.agents]

[validate.output_styles]

[session]
roots = ["~/.claude/projects"]

# The loop this repo ships, run on this repo. Thresholds keep their defaults
# until the ledger is large enough to have an opinion (same reasoning as the
# scaffold template). Ledgers land under `.harness/` (gitignored — one
# operator, one machine today; committing the decision ledger is the follow-up
# the day a second contributor arrives).
[lifecycle]

# Empty kinds on purpose: an event schema is declared when there is something
# to count (template rationale). The section exists so `lifecycle retire` can
# derive its Silent verdict from an honest, present-but-empty ledger.
[telemetry]
storage_dir = ".harness/telemetry"
