[workspace]
resolver = "3"
members = ["crates/harness-core", "crates/harness-cli"]

[workspace.package]
version = "0.1.11"
edition = "2024"
# Fully specified so the floor is a single toolchain. `rustup toolchain
# install 1.97` resolves to the latest 1.97.x, which is the pin — the MSRV job
# would then re-check the pinned compiler and call it a floor test.
rust-version = "1.97.0"
license = "MIT"
repository = "https://github.com/junyeong-ai/harnex"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
jiff = { version = "0.2", features = ["serde"] }
url = "2"
glob = "0.3"
regex = "1"
semver = "1"
tempfile = "3"
yaml_serde = "0.10"
walkdir = "2"
schemars = { version = "1", features = ["preserve_order", "jiff02", "semver1"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Strategy enums expose inherent `from_str(&str) -> Option<Self>`; implementing
# the std `FromStr` trait would require a `Result<Self, Self::Err>` signature
# that adds zero value for a closed set.
should_implement_trait = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
